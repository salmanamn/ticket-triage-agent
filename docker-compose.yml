name: triage-lab

services:
  mssql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    container_name: triage-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y in .env}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0
    container_name: triage-servicebus
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: "5300"
    volumes:
      - ./emulators/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:5300:5300"   # health + management

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    container_name: triage-cosmos
    restart: unless-stopped
    environment:
      PROTOCOL: http
      ENABLE_EXPLORER: "true"
      ENABLE_TELEMETRY: "false"
    volumes:
      - cosmos-data:/data
    ports:
      - "127.0.0.1:8081:8081"   # gateway (SDK endpoint)
      - "127.0.0.1:8082:8080"   # health (/ready); 8080 is taken by the Project 2 Kusto lab
      - "127.0.0.1:1234:1234"   # Data Explorer

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: triage-azurite
    restart: unless-stopped
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    volumes:
      - azurite-data:/data
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"

  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["ai"]
    container_name: triage-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"      # embedder + chat model stay resident (no swap per ticket)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"      # triage prompt ~2k tokens; headroom so nothing is silently truncated
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["notify"]
    container_name: triage-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI

volumes:
  cosmos-data:
  azurite-data:
  ollama-models: