name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  # Throwaway password for the CI-only SQL Server that backs the Service Bus emulator (port not published).
  MSSQL_SA_PASSWORD: Ci-only-Sa-Passw0rd
  SERVICEBUS_IMAGE: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0
  TF_VERSION: "1.17.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync (lockfile must be current)
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: src/requirements.txt matches uv.lock
        run: uv export --no-dev --no-hashes -o src/requirements.txt && git diff --exit-code src/requirements.txt
      - name: CI emulator images match docker-compose.yml
        run: ./scripts/ci-emulators.sh check-images

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync
        run: uv sync --locked
      - name: Unit tests (fakes, fake LLM, Event Grid stub)
        run: uv run pytest -m "not integration"

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
          MSSQL_MEMORY_LIMIT_MB: "1536"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-only-Sa-Passw0rd -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
        env:
          PROTOCOL: http
          ENABLE_EXPLORER: "false"
          ENABLE_TELEMETRY: "false"
        ports:
          - 8081:8081
          - 8082:8080
      mailpit:
        image: axllent/mailpit:v1.33.1
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync
        run: uv sync --locked
      - name: Start Service Bus emulator on the service network
        run: ./scripts/ci-emulators.sh start-servicebus "${{ job.services.mssql.network }}"
      - name: Wait for emulators + SDK smoke
        run: ./scripts/ci-emulators.sh wait
      - name: Integration tests (emulators, fake LLM, Event Grid stub, Mailpit)
        run: uv run pytest -m integration
      - name: Container logs
        if: failure()
        run: ./scripts/ci-emulators.sh logs

  tests-must-fail:
    name: tests-must-fail
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Sync
        run: uv sync --locked
      - name: Every known-bad mutation must fail the unit tests
        run: uv run python scripts/tests_must_fail.py

  iac-static:
    name: iac-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install Checkov and Conftest (versions pinned in scripts/iac.sh)
        run: ./scripts/iac.sh install-tools
      - name: fmt · validate · Checkov per root · policy unit tests
        run: ./scripts/iac.sh static

  iac-plan:
    name: iac-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      floci-az:
        image: floci/floci-az:0.16.0
        env:
          FLOCI_AZ_TLS_ENABLED: "true"
          FLOCI_AZ_SERVICES_FUNCTIONS_MOCKED: "true"
        ports:
          - 4577:4577
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # keep `terraform show -json` output clean
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install Checkov and Conftest
        run: ./scripts/iac.sh install-tools
      - name: Wait for floci-az and trust its certificate
        run: ./scripts/iac.sh wait-floci && ./scripts/trust-floci-cert.sh
      - name: Full-stack plan vs floci-az -> Conftest gate -> every IaC mutation must be denied
        run: ./scripts/iac.sh gate

  chart:
    name: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Helm (pinned, checksum-verified)
        run: ./scripts/ci-tools.sh helm
      - name: helm lint
        run: helm lint deploy/chart/ticket-triage -f deploy/chart/ci-values.yaml
      - name: Every template renders (lab on, KEDA, network policies)
        run: |
          set -o pipefail
          helm template triage deploy/chart/ticket-triage -n triage -f deploy/chart/ci-values.yaml | grep -c '^kind:'
      - name: No digest, no render (a cluster runs what CI built, D30)
        run: |
          if helm template triage deploy/chart/ticket-triage -n triage > /dev/null 2> err.txt; then
            echo "rendered without image.digest"; exit 1
          fi
          grep -q "image.digest is required" err.txt

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Trivy
        run: pipx install "uv==${UV_VERSION}" && ./scripts/ci-tools.sh trivy
      - name: Sync
        run: uv sync --locked
      - name: Build
        run: docker build --quiet -t ticket-triage:ci .
      - name: Image rules, then the host started without a network (D28)
        run: uv run python scripts/check_image.py --image ticket-triage:ci
      - name: Scan (no fixable Critical; High reported, D31) and SBOM
        run: |
          set -o pipefail
          trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table ticket-triage:ci | tee trivy.txt
          trivy image --quiet --format cyclonedx --output sbom.cdx.json ticket-triage:ci
          high=$(trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH --format json ticket-triage:ci | jq '[.Results[]?.Vulnerabilities[]?] | length')
          echo "fixable High findings: $high (reported, not gated)" | tee -a "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 ticket-triage:ci > /dev/null
          echo "fixable Critical findings: 0" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the image and its SBOM
        run: docker save ticket-triage:ci | zstd -T0 -3 -q -o image.tar.zst && ls -lh image.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: |
            image.tar.zst
            sbom.cdx.json
            trivy.txt
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
          compression-level: 0

  publish:
    name: publish
    needs:
      [
        lint,
        unit,
        integration,
        tests-must-fail,
        iac-static,
        iac-plan,
        chart,
        image,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ticket-triage
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Load
        run: zstd -dc image.tar.zst | docker load
      - name: Push to GHCR (sha-<12> and main; the platform pins the digest, D31)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          short=${GITHUB_SHA::12}
          for tag in "sha-$short" main; do
            docker tag ticket-triage:ci "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$short" --format '{{.Manifest.Digest}}')
          { echo "| image | pushed |"; echo "|---|---|"; echo "| ticket-triage | \`$IMAGE:sha-$short@$digest\` |"; } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
