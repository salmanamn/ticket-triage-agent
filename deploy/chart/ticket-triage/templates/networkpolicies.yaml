{{- /*
The tenant's own allow rules, on top of the platform's default deny and DNS (D30). Peers are this namespace's pods,
the namespaces the platform lists for ingress (KEDA), and the platform's ranges for this tenant on egress: the
platform's rule platform-tenant-network-policy judges every one of them.
*/ -}}
{{- if or .Values.lab.enabled .Values.network.ingressFromNamespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-http-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-triage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ticket-triage.selector" (dict "root" . "component" "http") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.lab.enabled }}
        - podSelector:
            matchLabels:
              {{- include "ticket-triage.selector" (dict "root" . "component" "lab-eventgrid") | nindent 14 }}
        {{- end }}
        {{- range .Values.network.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-functions-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-triage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ticket-triage
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [http, worker] }
  policyTypes: [Egress]
  egress:
    {{- range .Values.network.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if .Values.lab.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ticket-triage.selector" (dict "root" . "component" "lab-llm") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 11434 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "ticket-triage.selector" (dict "root" . "component" "lab-eventgrid") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 6100 }
    {{- end }}
{{- if .Values.lab.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-lab-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-triage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ticket-triage
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [lab-llm, lab-eventgrid] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ticket-triage
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [http, worker] }
      ports:
        - { protocol: TCP, port: 11434 }
        - { protocol: TCP, port: 6100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-lab-eventgrid-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-triage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ticket-triage.selector" (dict "root" . "component" "lab-eventgrid") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ticket-triage.selector" (dict "root" . "component" "http") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}